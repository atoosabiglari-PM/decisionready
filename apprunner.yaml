version: 1.0
runtime: python311
build:
  commands:
    build:
      - echo "DecisionReady build"
run:
  runtime-version: 3.11
  pre-run:
    - pip3 install .
  command: streamlit run webapp.py --server.address 0.0.0.0 --server.port 8080 --server.headless true
  network:
    port: 8080
    env: PORT
