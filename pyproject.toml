[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionready"
version = "0.1.0"
description = "Human-governed AI decision readiness for complex programs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "strands-agents>=1.55.1",
    "streamlit>=1.40"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
